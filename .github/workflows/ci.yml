name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # No postgres service container here on purpose. The integration tests use
    # Testcontainers (see Tests/TaskFlow.Api.IntegrationTests/Infrastructure),
    # which starts and disposes its own postgres:17 instance on an ephemeral
    # port. A service container would only be needed if the tests pointed at a
    # fixed connection string, and having both would just mean two databases,
    # one of them unused. The ubuntu-latest runner provides the Docker daemon
    # Testcontainers needs.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: >-
          dotnet test
          --no-build
          --configuration Release
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./TestResults
        env:
          # Tests must not depend on a real signing key. Anything that needs one
          # should generate it in the fixture.
          Jwt__Key: ci-only-not-a-secret-value-for-test-runs-only

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./TestResults
          if-no-files-found: ignore
