name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Uncomment from phase 8.2 onward, when integration tests need a real database.
    # Testcontainers manages its own containers, so this service block is only
    # needed if you point tests at a fixed connection string instead.
    #
    # services:
    #   postgres:
    #     image: postgres:17
    #     env:
    #       POSTGRES_DB: taskflow_test
    #       POSTGRES_USER: postgres
    #       POSTGRES_PASSWORD: postgres
    #     ports:
    #       - 5432:5432
    #     options: >-
    #       --health-cmd pg_isready
    #       --health-interval 10s
    #       --health-timeout 5s
    #       --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: >-
          dotnet test
          --no-build
          --configuration Release
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./TestResults
        env:
          # Tests must not depend on a real signing key. Anything that needs one
          # should generate it in the fixture.
          Jwt__Key: ci-only-not-a-secret-value-for-test-runs-only

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./TestResults
          if-no-files-found: ignore
